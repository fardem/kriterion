# Pruefstand bei jedem Push auf jeden Zweig und auf Knopfdruck (Actions -> Pruefstand -> „Run workflow“).
name: Pruefstand

# Kein `pull_request` daneben: das gaebe zwei Laeufe auf denselben Stand.
on:
  push:
  workflow_dispatch:

# Ein neuer Push auf denselben Zweig bricht den vorigen Lauf ab; der Schluessel nennt den Zweig.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dieselbe Version wie im Dockerfile; der Pruefstand vergleicht beide.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # npm ci liest das Lockfile; weicht es von package.json ab, scheitert der Lauf.
      - name: Abhaengigkeiten
        run: npm ci

      - name: Pruefstand
        run: npm test

      # Ueber alle Abhaengigkeiten, auch die zum Entwickeln.
      - name: Bekannte Luecken
        run: npm audit --audit-level=high
