services:
  kriterion:
    build: .
    container_name: kriterion
    restart: unless-stopped
    env_file: .env
    ports:
      # Links der Port am Server.
      - "3100:3000"
    volumes:
      - ./data:/app/data
      # Backup-Ordner. Besser ausserhalb des Projekts: ../kriterion-backup:/app/backup
      - ./kriterion-backup:/app/backup
    environment:
      - PORT=3000
      # Zeitzone des Protokolls und der Namen neuer Backups. Gespeicherte Zeiten bleiben UTC.
      - TZ=Europe/Berlin
      # Ohne diese Zeile keine Karte "Backup". Pfad wie in der Einhaengung oben.
      - BACKUP_DIR=/app/backup
    # /tmp im RAM; dort entsteht ein Proxy vor dem Verschluesseln. Ohne tmpfs keine Proxys.
    # 2g reichen bei 7,5 Mbit/s fuer rund 35 Minuten Video.
    tmpfs:
      - /tmp:size=2g
    # Quick Sync fuer die Proxys (README, "Proxys fuer Videos"). Auskommentiert: die CPU wandelt um.
    # devices:
    #   - /dev/dri:/dev/dri
